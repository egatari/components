name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # npm test: lint, CATALOG.md, release tarball (deterministic), unit tests, and every demo built and checked in a browser
  # with the pinned Egatari Studio (tools/studio.json; fetched into .studio/ by tools/studio.mjs).
  # Browser: Studio's kit/browser.mjs tries CHROME_PATH, then Google Chrome, then Microsoft Edge, then Playwright's Chromium.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: npm exec --yes -- playwright-core@1.64.1 install --with-deps chromium
      - name: npm test
        env:
          CI: 'true'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm test
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/egatari-components-test-*
            /tmp/egatari-components-test-*
            /var/folders/*/*/T/egatari-components-test-*
          if-no-files-found: ignore
          retention-days: 7
