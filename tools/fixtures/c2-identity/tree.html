<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<title>m-tree: formulas (tools/test-c2-identity.mjs)</title>
<!-- The v1.13.0 demo has no tex. 2.0 renders tex at build time (spec §6.2: nodes[].tex → texHtml) and reads it through
     markup-reader; this deck checks that the DOM stays that of 1.13 (KaTeX at play time): nodes with formulas down and right,
     fractions, roots (KaTeX's SVG), accents, a note under a formula, a path, the variants. -->
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>確率の木</h2>
  <div class="body">
    <m-tree style="height:470px">
      <script type="application/json">{
        "nodes": [
          {"id": "r", "tex": "\\Omega"},
          {"id": "a", "tex": "A", "parent": "r", "branch": "0.3"},
          {"id": "b", "tex": "\\bar{A}", "parent": "r", "branch": "0.7"},
          {"id": "a1", "tex": "A\\cap B", "parent": "a", "note": "0.12"},
          {"id": "a2", "tex": "A\\cap\\bar B", "parent": "a"},
          {"id": "b1", "tex": "\\frac{P(B)}{P(A)}", "parent": "b", "tone": "emph"},
          {"id": "b2", "tex": "\\sqrt{2}", "parent": "b"}
        ],
        "path": ["r", "b", "b1"]
      }</script>
    </m-tree>
  </div>
  <div class="concl"><span>→ 枝の確率をかけると、葉の確率になる</span></div>
</section>

<section class="slide noconcl">
  <h2>見せ方</h2>
  <div class="body">
    <div class="cols">
      <div><m-tree orient="right" variant="draw" style="height:360px">
        <script type="application/json">{"nodes": [{"id": "r", "tex": "x"}, {"id": "a", "tex": "x^2", "parent": "r"}, {"id": "b", "label": "字", "parent": "r"}]}</script>
      </m-tree></div>
      <div><m-tree variant="grow" style="height:360px">
        <script type="application/json">{"nodes": [{"id": "r", "tex": "\\sum_{i=1}^n i"}, {"id": "a", "tex": "\\frac{n(n+1)}{2}", "parent": "r"}]}</script>
      </m-tree></div>
    </div>
  </div>
</section>

</div>
</body>
</html>
