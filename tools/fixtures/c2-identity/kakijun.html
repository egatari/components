<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<title>m-kakijun: options the demo does not reach (tools/test-c2-identity.mjs)</title>
<!-- per="stroke", the pen variant, endings, small kana in vertical writing with labels, grid="none", ghost="off", characters
     without stroke data and boxes made smaller to fit: each drawn by 1.13.0 and by 2.0.0 and compared at every step. -->
</head>
<body>
<div id="stage">

<section class="slide noconcl">
  <h2>1 画ずつ（pen・終わり）</h2>
  <div class="body">
    <m-kakijun text="あガ" per="stroke" ends="on" variant="pen" style="height:300px"></m-kakijun>
  </div>
</section>

<section class="slide noconcl">
  <h2>縦書きの小さい字</h2>
  <div class="body">
    <m-kakijun text="きょうしゃっ" writing="tate" size="120" style="height:440px"></m-kakijun>
  </div>
</section>

<section class="slide noconcl">
  <h2>縦書き・終わり</h2>
  <div class="body">
    <m-kakijun text="きょしゃっ" writing="tate" size="200" ends="on" style="height:500px"></m-kakijun>
  </div>
</section>

<section class="slide noconcl">
  <h2>横書き・枠なし・薄い画なし</h2>
  <div class="body">
    <m-kakijun text="ぱぴぷ" grid="none" ghost="off" style="height:300px"></m-kakijun>
  </div>
</section>

<section class="slide noconcl">
  <h2>データのない字</h2>
  <div class="body">
    <m-kakijun text="漢字あ" style="height:300px"></m-kakijun>
  </div>
</section>

<section class="slide noconcl">
  <h2>長い列</h2>
  <div class="body">
    <m-kakijun text="あいうえおかきくけこ" style="height:400px"></m-kakijun>
  </div>
</section>

</div>
</body>
</html>
