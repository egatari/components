/* 舞台・段階表示・印刷（base.css）。テーマに依存しない部分
   段階の見え方（opacity / transform / 線の描画）は deck.js が (i, k, t) から直接書く。ここでは初期値と印刷だけを決める */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--stage-bg,#2f2f2f)}
body{font-family:var(--font-sans);font-weight:var(--weight-body,400);color:var(--fg);overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%}
/* スライド：重ねて描く。display を切り替えないので、隠れたスライドでも図の大きさを測れる */
.slide{position:absolute;inset:0;width:1280px;height:720px;background:var(--bg);overflow:hidden;visibility:hidden;opacity:0}
.slide.active{visibility:visible;opacity:1}
[data-step]{opacity:0}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.static [data-step],.static .draw{opacity:1;stroke-dashoffset:0}

/* 授業モード：全部見せ、段階より後の要素は deck.js が薄くする（今の段階に印は付けない） */
/* lecture view: opacity of the steps not yet reached (a theme may override, keep it within .45-.5); the current step is not marked */
:root{--lecture-dim:.5}

/* 操作の表示 */
#bar{position:fixed;left:0;bottom:0;height:var(--bar-h,3px);background:var(--bar,var(--emph));z-index:10}
#jump{position:fixed;right:12px;bottom:10px;color:#fff;font:14px sans-serif;opacity:.7;z-index:10}
.embedded #bar,.embedded #jump{display:none}
.embedded body,.embedded{background:var(--bg)}
/* 暗転（b。kit/deck.js）：窓全体を真っ黒の覆いで隠す。舞台・ペンの線・字幕・操作の帯・知らせ・戻るの札より上。印刷と動画には出ない */
#deck-black{position:fixed;inset:0;z-index:2147483600;background:#000;cursor:default;outline:none}
.printing #deck-black{display:none}
#deck-black-hint{position:absolute;right:16px;bottom:14px;padding:4px 10px;border-radius:6px;color:rgba(255,255,255,.55);background:rgba(255,255,255,.06);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;opacity:0;transition:opacity .3s;pointer-events:none}
#deck-black-hint.show{opacity:1}
/* 舞台は押したときにフォーカスを受ける（kit/tools.js：ペン・レーザーで押してもキーが本体に届くように）。枠は出さない */
#stage:focus{outline:none}
.autoplay #bar{background:var(--term)}

/* 字幕（s / ?captions=1）：舞台の下端に、テーマの文字色を地に、地の色で書く（--fg と --bg のコントラストは品質チェックが見ている） */

.printing #deck-cap{display:none}
/* 短い知らせ（Shift+s の字幕の大きさ、ペンの色など）。発表のときだけ。印刷と動画には出ない */

#deck-extlink{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}

#deck-back{all:unset;position:fixed;left:10px;top:7px;z-index:36;box-sizing:border-box;display:flex;align-items:center;gap:6px;max-width:min(46vw,420px);height:28px;padding:0 9px 0 7px;

@media print{

  .slide,.sec{-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* スライドの体裁（layouts.css）
   寸法は 16:9 の PowerPoint（13.333in 幅）の体裁を 1280×720px に換算したもの（1pt = 1.333px）。
   余白 48px、タイトル 43px（32pt）、本文 32px（24pt、縮めても 27px = 20pt）、図・表 24px（18pt）以上、
   結論の行は上端 571px・高さ 72px。色はテーマの変数だけを使う */
.slide h2{position:absolute;left:48px;right:48px;top:40px;margin:0;font-size:43px;line-height:1.25;font-weight:700;
  padding-bottom:10px;border-bottom:2px solid var(--rule);color:var(--title)}
.body{position:absolute;left:48px;right:48px;top:122px;bottom:160px;font-size:32px;line-height:1.45}
.slide.noconcl .body{bottom:64px}

.body p{margin:0 0 8px}
.body ul,.body ol{margin:0 0 8px;padding-left:1.2em}
.body li{margin:0 0 4px}
.body li::marker{color:var(--marker,var(--term))}
.body li ul{margin-top:2px}
.body li li{list-style:"－ "}
.body ul ul{font-size:28px}
.concl{position:absolute;left:48px;right:48px;top:571px;height:72px;border:2.3px solid var(--emph);border-radius:10px;
  color:var(--emph);background:var(--concl-bg,transparent);font-weight:700;font-size:32px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.pn{position:absolute;right:48px;bottom:14px;font-size:16px;color:var(--muted)}

/* 文字と部品 */
.term,.blue{color:var(--term)} .emph,.red{color:var(--emph)} .b{font-weight:700}
.gray,.gray .katex,.muted{color:var(--muted)}
.note{font-size:27px;margin:2px 0 10px}
/* スライドの中のリンク（スライドへの #<id> も、ほかのファイルへも）。:where で詳細度を 0 にし、部品（m-menu の札）が自分の見た目で上書きできるように */
:where(.slide) :where(a[href]){color:var(--term);text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.16em}

table{border-collapse:collapse;width:100%;font-size:28px;line-height:1.35}

.cover{text-align:center;background:var(--cover-bg,var(--bg))}

.m-error{box-sizing:border-box;width:100%;min-height:100%;display:flex;align-items:center;padding:14px 18px;border:3px dashed var(--emph);border-radius:6px;color:var(--emph);font-size:27px;line-height:1.35;overflow-wrap:anywhere;writing-mode:horizontal-tb}

/* 国語：縦書き・ルビ・明朝（kokugo テーマと m-kanbun・m-kobun・m-gendai が使う。どのデッキでも使える）
   --font-mincho は BIZ UDP明朝。build は、デッキが明朝を使うとき（var(--font-mincho)・class="mincho"・<html data-font="mincho">）だけ字を埋め込む。
   :where(:root) にして、テーマの :root が --font-mincho を上書きできるようにする */
:where(:root){--font-mincho:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif}
html[data-font="mincho"]{--font-sans:var(--font-mincho)}
.mincho{font-family:var(--font-mincho)}
/* 縦書きの塊：.body の高さいっぱいに、右から左へ列を並べる。段落の間は左へ空ける */
.tate{writing-mode:vertical-rl;text-orientation:mixed;height:100%;margin-left:auto;line-height:1.8;line-break:strict}
.tate p{margin:0 0 0 .5em}
.tate p.indent{text-indent:1em}
/* 縦中横（縦書きの中の 2 桁の数字など） */
.tcy{text-combine-upright:all}
/* ルビ：振り仮名は 0.5em（品質チェックは rt の字の大きさを数えない）。縦書きでは右に付く */
rt{font-size:.5em;line-height:1}

/* 縦組みのスライド（class="slide layout-tate"）：見出しは右端の列に縦書きで天付き、見出しの下線は列の左の縦の罫になる。
   本文（.body）は縦書き（右から左へ列が進む）で、見出しの左に組む。結論の行は左端の縦の列。ページ番号は右下のまま（見出しの列の下）。
   寸法：見出しの列 1166〜1232px（字 43px、罫は 1166px）、本文 148（結論がなければ 48）〜1138px・天 48px・地 664px、結論の列 48〜120px。
   部品・図・表など（p・ul・ol・.tate などの文章の塊でないもの）は横組みのまま本文の幅いっぱいに置く（部品は自分の幅を測って描くので） */
.slide.layout-tate h2{left:auto;right:48px;top:48px;bottom:56px;writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;
  padding:0 0 0 10px;border-bottom:0;border-left:2px solid var(--rule);overflow:hidden}
.slide.layout-tate .body{left:148px;right:142px;top:48px;bottom:56px;writing-mode:vertical-rl;text-orientation:mixed;line-height:1.8;line-break:strict}
.slide.layout-tate.noconcl .body{left:48px;bottom:56px}
.slide.layout-tate .body p{margin:0 0 0 .5em}
.slide.layout-tate .body :is(ul,ol){margin:0 0 0 8px;padding:1.2em 0 0}

.slide.layout-tate .body .sub{margin:0 0 0 8px}
.slide.layout-tate .body > :not(p,ul,ol,.sub,.note,.arrow,.tate,.box,.thm,h3,blockquote){writing-mode:horizontal-tb;width:100%}
.slide.layout-tate .body > .tate{height:100%;margin:0}

/* 既定のテーマ（default）
   基調色 --base を 1 つ決めれば、ほかの色はそこから導く（academic-* テーマの「基調色＋補色＋淡色」と同じ考え方）。
   部品とレイアウトは意味で名付けた変数（--term, --emph, --muted …）だけを参照する */
:root{
  --base: #1d4f91;                 /* 基調色。テーマごとにこれを替える */
  /* --emph-hue（結論・問題の色相）：既定では宣言しない。テーマが宣言すると --emph は oklch(0.52 0.21 <色相>) から導く
     （下の @supports。kokugo は 38）。宣言しなければ --emph は下の固定の値 */

  /* 導かれる色。ここでは古いブラウザ向けの固定の値（既定の --base #1d4f91 から計算した値）を置き、
     下の @supports で基調色から導く式に置き換える（カスタムプロパティは後の宣言が常に勝つので、
     「前に予備の値を書く」だけでは効かない。対応しているかを @supports で分ける） */
  --complement: #744400;
  --accent2:    #744400;
  --base-tint:  #cbd7e8;
  --base-wash:  #eef2f8;
  --comp-tint:  #e0d4c3;

  /* 意味の色（部品はここだけを使う） */
  --fg:      #222222;
  --bg:      #ffffff;
  --title:   var(--base);                       /* 古いブラウザでは基調色そのもの */
  --term:    var(--base);                       /* 用語・問い・補足 */
  --emph:    var(--emph-from-hue, #BE3012);     /* 結論・問題・目標。朱寄りの赤（白地 5.8:1。1 型色覚の模擬でも墨と分かれる。1.1.0） */
  --muted:   #5C5853;                           /* 既知の結果・比較対象。温かい灰（白地 7.1:1。明るい教室の投影でも読める。1.1.0） */
  --line:    #cccccc;
  --rule:    var(--base);
  --term-tint: var(--base-wash);
  --emph-tint: #fbe7e3;
  --concl-bg:  #F5F5F5;                         /* 結論の行の地。無彩のごく淡い灰（--emph の字 5.3:1・--fg 14.6:1。色覚の型と白黒でも見え方が同じ。1.2.0） */

  /* 図の系列の色（順に使う） */
  --series-1: var(--term);
  --series-2: var(--emph);
  --series-3: var(--accent2);
  --series-4: var(--muted);

  /* 字 */
  --font-sans: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  --weight-body: 400;

  /* 字幕（s）：字の大きさ・下端からの距離・左右の余白・1 まとまりの行数の上限。読む速さ（字/秒）は --cap-rate（既定 ja 7、en 15） */
  --cap-size: 27px;
  --cap-bottom: 18px;
  --cap-side: 96px;
  --cap-max-lines: 3;
}
/* 対応しているブラウザでは基調色から導く（Chrome/Edge 119+、Firefox 128+、Safari 18+）。
   テーマの tokens.css はこの後に読まれるので、テーマが上書きした値はそのまま勝つ */
/* --emph-hue を宣言したテーマだけ：--emph-hue がなければ --emph-from-hue は無効になり、--emph は固定の値 #BE3012 になる */
@supports (color: oklch(0.5 0.1 30)){
  :root{ --emph-from-hue: oklch(0.52 0.21 var(--emph-hue)); }
}
@supports (color: color-mix(in oklch, red 10%, white)){
  :root{
    --base-tint:  color-mix(in oklch, var(--base) 22%, white);
    --base-wash:  color-mix(in oklch, var(--base) 7%, white);
    --emph-tint:  color-mix(in oklch, var(--emph) 12%, white);
  }
}
@supports (color: oklch(from red min(l, 0.5) c calc(h + 180))) and (color: color-mix(in oklch, red 10%, white)){
  :root{
    --complement: oklch(from var(--base) l c calc(h + 180));
    --accent2:    oklch(from var(--complement) min(l, 0.55) c h);
    --comp-tint:  color-mix(in oklch, var(--complement) 22%, white);
    --title:      oklch(from var(--base) min(l, 0.32) c h);
  }
}
/* 結論の行（1.2.0）：左の縦線＋決まった位置（571px・高さ 72px は kit/layouts.css のまま）＋太字＋淡い灰の地 --concl-bg。色だけに頼らない（WCAG 1.4.1）。
   テーマの CSS は layouts.css の後に読まれるので、同じ詳細度（:where は 0）で勝つ。縦組み（layout-tate）の結論の列は今までの枠のまま */
:where(.slide:not(.layout-tate)) .concl{left:30px;border:0;border-left:5px solid var(--emph);border-radius:0;justify-content:flex-start;padding-left:13px}

/* 英語など、日本語以外のデッキ（<html lang> が ja 以外）だけに build が加える。日本語のデッキの体裁は変えない
   本文は Source Sans 3（OFL）、和文などラテン文字以外の字は BIZ UDPゴシックで補う */
:root{--font-sans:"Source Sans 3","BIZ UDPGothic",sans-serif}

// ---------------------------------------------------------------- 起動
function fit(){

function init(){

  if (window.parent !== window) window.addEventListener("message", function(e){ if (e.source === window.parent && e.data && e.data.type === "app-pres-tap" && !document.hasFocus()) tap.hidden = false; });

    if (!e.defaultPrevented && !e.metaKey && !e.ctrlKey && !e.altKey && (k === "Escape" || k === "p")){

  document.getElementById("pv-auto").onclick = function(e){ send("auto"); if (e.detail !== 0) this.blur(); };

  // 道具のボタン：キーと同じ（tools.js の DECK.ptools.key）。フォーカスを奪わないので、押した後も矢印で送れる
  [].forEach.call(document.querySelectorAll("#pv button"), function(b){ b.addEventListener("mousedown", function(e){ e.preventDefault(); }); });

      var n = b.getAttribute("data-b"), on = n === "lect" ? DECK.mode === "lecture" : n === m;   // 先のステップを薄く見せる：字幕と同じ入／切
      b.classList.toggle("on", on);
      if (b.hasAttribute("aria-pressed")) b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }
  document.addEventListener("deck:ptool", syncTools);
  syncTools();
  document.getElementById("pv-reset").onclick = function(){ started = Date.now(); };
  setInterval(function(){
    var s = Math.floor((Date.now() - started) / 1000);
    document.getElementById("pv-timer").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    var d = new Date(); document.getElementById("pv-clock").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
  }, 500);
  send("hello");
};
})();

<script>
// 発表中の道具（tools.js）：一覧表示、レーザーポインタ、ペン、消えるペン。(i, k, t) の描画とは独立した重ね描き
// - o：一覧（矢印で選び Enter・クリックで移る、Esc / o で閉じる）

//   ペンの間は帯のペンのボタンの後ろに色のボタンが出る。色を変えると短く知らせ、発表者ビューにも番号で知らせる
// - m・d：マーカー（編集モードの間だけ。帯のペンのボタンも、編集中は「マーカー」になってこれを切り替える。開発サーバー・編集アプリのプレビュー）。描き終えた線を deck:ink {pts} で知らせ（server/hints.js が
//   コメントの知らせにする）、描いた線はすぐ消す（残すのは親の画面の重ね #dev-pins）。編集モードでないとき・発表者ビューからは使えない
// - Backspace：今のスライドの書き込みを消す（ペンのとき）、Shift+Backspace：全スライドの書き込みを消す
// - 動画（?mode=video）では何も作らない。印刷では隠す。発表者ビューの「今の画面」で描いた線は本体に送る
// - 操作の帯：マウスを動かすと下の余白（足りなければ下端）に出て、2.5 秒止まると隠れる。ボタンはキーと同じ操作をする
// - ?：キーの一覧（開発サーバーのときは e / n / c も載せる）。下に「フィードバックを送る」（DECK.feedbackUrl、data-feedback="off" で消える）
// - キーボードだけでも使える：帯のボタンは Tab で選べ（フォーカスの枠は :focus-visible のときだけ）、切り替えのボタンは aria-pressed、
//   一覧の縮図はボタンで、矢印で選ぶとフォーカスも動く。一覧・キーの一覧を Esc で閉じると、開く前のフォーカスに戻す
(function(){
"use strict";
var DECK = window.DECK;
if (!DECK || DECK.mode === "video") return;
var Q = new URLSearchParams(location.search);
var W = 1280, H = 720;
var COLORS = ["emph", "term", "fg"];
var LABEL = DECK.ja === false ? {laser: "Laser pointer", pen: "Pen", vpen: "Fading pen", ink: "Marker"} : {laser: "レーザーポインター", pen: "ペン", vpen: "消えるペン", ink: "マーカー"};

var CNAME = DECK.ja === false ? ["Red", "Blue", "Black"] : ["赤", "青", "黒"];

    if (phase === "leave"){ dot.classList.remove("show"); return; }

  place(ctx){

    var W = this.clientWidth, H = this.clientHeight, inter = !this.video;

    var lw = Math.min(W * 0.34, Math.max.apply(null, ch.map(function(c){ return est(c.label, LS, true); })) + 16);

    };

    this.frame = D.el("rect", {x: 2, y: 0, width: Math.max(0, W - cw - 12), height: rh - 8, rx: 10, fill: "none", stroke: "var(--emph)", "stroke-width": 3, opacity: 0}, svg);
    this.frameLen = 2 * (W - cw - 12 + rh - 8);

    if (P.ticks){ var z = D.el("text", {"font-size": 24, "text-anchor": "middle", x: G.x0, y: G.y1 + 30}, gT); z.textContent = "0"; }

    this.liveEl.textContent = T.liveResults;
    // 操作：選択肢の名前（自分の予想）、−1・数の欄・＋1。動画では作らない
    if (inter){
      var mkEl = function(tag, cls, attrs){ var e = document.createElement(tag); e.className = cls; for (var a in attrs) e.setAttribute(a, attrs[a]); self.appendChild(e); return e; };

        var top = r.cy - 24;
        r.pick = mkEl("button", "pd-pick", {type: "button", "aria-pressed": "false", "aria-label": T.guessLabel(ch[i].label)});

        Object.assign(ctl.style, {left: (W - cw + 16) + "px", top: top + "px"});
        var bt = function(txt, dlt, ariaLabel){
          var b = document.createElement("button"); b.type = "button"; b.className = "pd-btn"; b.textContent = txt; b.setAttribute("aria-label", ariaLabel);
          b.addEventListener("click", function(e){ e.stopPropagation(); self.bump(i, dlt); });

        };
        ctl.appendChild(bt("−1", -1, T.decrease(ch[i].label)));

        f.type = "text"; f.className = "pd-num"; f.setAttribute("inputmode", "numeric"); f.setAttribute("autocomplete", "off");

        ctl.appendChild(bt("+1", 1, T.increase(ch[i].label)));

    }
    function tone(t){ return /^(term|emph|muted|accent2|fg|series-[1-4])$/.test(t || "") ? "var(--" + t + ")" : "var(--term)"; }
  }
  // ---- 見る人の状態（(i, k, t) の外）
  // 今の数（見る人が変えていればその値、そうでなければ作者の値）。新しい配列を返す
  counts(){ return (this._vc || this.author).slice(); }

  input(choice, count){
    if (this.video) return;
    var n = this.author.length;
    if (!Number.isInteger(choice) || choice < 0 || choice >= n || !Number.isInteger(count) || count < 0 || count > 9999){
      console.warn("[predict] input(" + JSON.stringify(choice) + ", " + JSON.stringify(count) + ") ignored (choice 0–" + (n - 1) + ", count a whole number 0–9999)");
      return;
    }
    this.set(choice, count);
  }
  bump(i, dl){ this.set(i, this.counts()[i] + dl); }
  set(i, v){
    if (this.video || !this.rows) return;
    v = Math.max(0, Math.min(9999, v));
    var c = this.counts();
    if (c[i] === v) return;
    c[i] = v; this._vc = c;
    this.redraw();

  }
  // 自分の予想（1 つ。もう一度押すと外す）
  choose(i){
    if (this.video) return;

    this.redraw();
    var lab = d.choices[i].label;
    this.say.textContent = this._pick === null ? T.unpicked : this.revealed() ? (i === d.answer ? T.pickedRight(lab) : T.pickedWrong(d.choices[d.answer].label)) : T.myGuess(lab);

  reset(){

  }
  // 触った跡だけを戻す（ctx.reset）：部品の中のフォーカスを外す（欄は今の数を出し直す）。数と予想（見る人の入力）は残す
  untouch(){
    var a = document.activeElement;
    if (a && a !== this && this.contains(a) && a.blur) a.blur();
  }
  // 入力のあとの描き直し：最後の (k, t) で paint だけを呼ぶ（render を通さないので、ctx.entered・ctx.reset を繰り返さない）
  redraw(){ if (this._k !== undefined) this.paint(this._k, this._t, this._ctx); }

    var a = this.aStep, d = 0;

  }
  render(k, t, ctx){
    // ほかのスライドから入ったとき・飛んだとき（ctx.entered）だけ、見る人の状態を捨てる。同じスライドの中の段階の移りでは残す。
    // ctx.reset（触った部品が段階に入るとき）は触った跡だけを戻し、見る人の入力は消さない（仕様 §8.4）
    if (ctx.entered === true) this.reset();

  // (k, t) と見る人の状態の絵。ctx は {mode, preview, live}
  paint(k, t, ctx){

    var a = this.aStep;

      r.val.setAttribute("x", (X(c[j]) + 10).toFixed(1));
      r.val.setAttribute("opacity", e.toFixed(3));

    this.liveEl.setAttribute("opacity", live && k >= 1 ? 1 : 0);

      return [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].filter(function(s){ return s >= x - 1e-9; })[0] * e; }
    function up(v){ var e = Math.pow(10, Math.floor(Math.log10(v))); return Math.round([1, 2, 5, 10, 20].filter(function(s){ return s * e > v + 1e-9; })[0] * e); }

      return Math.round((x <= 1 ? 1 : x <= 2 ? 2 : x <= 2.5 ? 2.5 : x <= 5 ? 5 : 10) * e); }
  }
  fmt(v){ return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ",") + this.props.unit; }
};
});

}
