<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-numeric の見本</title>
<!-- 組み方：node kit/build.mjs components/numeric/demo.html -o components/numeric/out/demo.html -->
<style>
</style>
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>数で答えよう：立方体の体積</h2>
  <div class="body">
    <p class="ia-badge" style="margin:0 0 10px;line-height:1.3"><span style="display:inline-block;font-size:27px;font-weight:700;color:var(--fg);border:2px dashed var(--accent2);border-radius:8px;padding:0 12px">操作できる</span></p>
    <div style="display:grid;grid-template-columns:390px 1fr;gap:32px;align-items:start">
      <svg viewBox="0 0 390 360" width="390" height="360" role="img" aria-label="1 辺が 3 cm の立方体">
        <path d="M90 120 L150 60 L340 60 L280 120 Z" style="fill:var(--term-tint);stroke:var(--term)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M280 120 L340 60 L340 250 L280 310 Z" style="fill:var(--term-tint);stroke:var(--term)" stroke-width="3" stroke-linejoin="round"/>
        <rect x="90" y="120" width="190" height="190" style="fill:var(--bg);stroke:var(--term)" stroke-width="3"/>
        <text x="185" y="345" font-size="28" text-anchor="middle" style="fill:var(--fg)">3 cm</text>
        <text x="80" y="225" font-size="28" text-anchor="end" style="fill:var(--fg)">3 cm</text>
        <text x="310" y="305" font-size="28" style="fill:var(--fg)">3 cm</text>
      </svg>
      <m-numeric size="36" style="height:380px">
        <script type="application/json">{
          "question": "1 辺が 3 cm の立方体の体積は何 cm³？",
          "answer": 27,
          "unit": "cm³",
          "note": "体積は 縦 × 横 × 高さ。3 × 3 × 3 = 27"
        }</script>
      </m-numeric>
    </div>
  </div>
  <div class="concl"><span>→ 1 辺が 2 倍になると、体積は 8 倍になる</span></div>
</section>

<section class="slide">
  <h2>数で答えよう：落ちる速さ</h2>
  <div class="body">
    <p style="margin:0 0 12px">空気の抵抗は考えない。小数第 1 位まで答える</p>
    <div style="display:grid;grid-template-columns:1fr 380px;gap:40px;align-items:start">
      <m-numeric size="36" style="height:380px">
        <script type="application/json">{
          "question": "落ちる物の速さは、1 秒ごとに約何 m/s 速くなる？",
          "answer": 9.8,
          "tolerance": 0.1,
          "unit": "m/s",
          "note": "重力加速度 g は約 9.8 m/s²。9.7〜9.9 を正解にした"
        }</script>
      </m-numeric>
      <div>
      <table style="font-size:28px;border-collapse:collapse">
        <thead><tr><th style="padding:8px 16px;border-bottom:2px solid var(--line)">落ちてからの時間</th><th style="padding:8px 16px;border-bottom:2px solid var(--line)">速さ</th></tr></thead>
        <tbody>
          <tr><td style="padding:8px 16px;text-align:right">0 秒</td><td style="padding:8px 16px;text-align:right">0 m/s</td></tr>
          <tr><td style="padding:8px 16px;text-align:right">1 秒</td><td style="padding:8px 16px;text-align:right">？</td></tr>
          <tr><td style="padding:8px 16px;text-align:right">2 秒</td><td style="padding:8px 16px;text-align:right">？</td></tr>
          <tr><td style="padding:8px 16px;text-align:right">3 秒</td><td style="padding:8px 16px;text-align:right">？</td></tr>
        </tbody>
      </table>
      </div>
    </div>
  </div>
  <div class="concl"><span>→ 重さによらず、毎秒およそ 9.8 m/s ずつ速くなる</span></div>
</section>

</div>
</body>
</html>
